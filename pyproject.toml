[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-zero"
version = "0.12.0"
description = "Source-code security triage for Python, JavaScript, and TypeScript."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "mypy==2.4.0", "types-PyYAML==6.0.12.20260906"]

[project.scripts]
sentinel-zero = "sentinel_zero.cli:main"
sentinel-zero-mcp = "sentinel_zero.mcp_server:main"

[tool.setuptools.packages.find]
include = ["sentinel_zero*"]

[tool.setuptools.package-data]
sentinel_zero = [
    "data/*.json",
    "resolvers/js/*.js",
    "resolvers/js/package.json",
    "resolvers/js/package-lock.json",
    "probes/js/*.js",
]

[tool.pytest.ini_options]
markers = [
    "docker_integration: executes a real Docker diagnostic backend; flag and mock tests are not integration",
]

[tool.mypy]
python_version = "3.10"
files = ["sentinel_zero", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
