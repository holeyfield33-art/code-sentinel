[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-zero"
version = "0.12.0"
description = "Resolved-identity call-graph security analysis for Python and JS/TS -- no text/name matching, no silent tool failure, no hardcoded attack taxonomy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sentinel-zero = "sentinel_zero.cli:main"
sentinel-zero-mcp = "sentinel_zero.mcp_server:main"

[tool.setuptools.packages.find]
include = ["sentinel_zero*"]

[tool.setuptools.package-data]
sentinel_zero = [
    "data/*.json",
    "resolvers/js/*.js",
    "resolvers/js/package.json",
    "resolvers/js/package-lock.json",
    "probes/js/*.js",
]
