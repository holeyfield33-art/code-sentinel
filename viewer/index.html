<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentinel-Zero — Graph Viewer</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel-bg: rgba(16, 20, 28, 0.92);
      --panel-border: #2a3140;
      --text: #d7dce3;
      --text-dim: #8b95a5;
      --accent: #5aa9ff;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #scene-container { position: absolute; inset: 0; }
    #hud {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 10px; padding: 14px 16px; width: 300px; max-height: 92vh; overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    #hud h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; letter-spacing: 0.2px; }
    #hud p.sub { margin: 0 0 10px; font-size: 12px; color: var(--text-dim); }
    #hud h3 { font-size: 11px; margin: 14px 0 6px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
    .btn {
      display: inline-block; font-size: 13px; padding: 7px 12px; border-radius: 6px;
      background: #1b2230; border: 1px solid var(--panel-border); cursor: pointer; color: var(--text);
    }
    .btn:hover { border-color: var(--accent); }
    .btn.small { font-size: 12px; padding: 5px 10px; }
    #file-input, #compare-input { display: none; }
    #stats { margin-top: 10px; font-size: 12px; color: var(--text-dim); line-height: 1.5; }
    #search-input {
      width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; font-size: 13px;
      background: #0e1420; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text);
    }
    #search-input:focus { outline: none; border-color: var(--accent); }
    #legend { font-size: 12px; line-height: 1.9; }
    .legend-row {
      display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
      padding: 2px 4px; border-radius: 4px; opacity: 1;
    }
    .legend-row:hover { background: rgba(255,255,255,0.05); }
    .legend-row.inactive { opacity: 0.35; }
    .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    #filter-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    #compare-summary { margin-top: 8px; font-size: 12px; line-height: 1.6; }
    #compare-summary .removed-list { max-height: 90px; overflow-y: auto; margin-top: 4px; font-size: 11px; color: var(--text-dim); }
    #inspector {
      position: absolute; top: 16px; right: 16px; z-index: 10;
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 10px; padding: 14px 16px; width: 320px; max-height: 70vh; overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: none;
      font-size: 13px;
    }
    #inspector h2 { font-size: 14px; margin: 0 0 8px; word-break: break-all; }
    #inspector dl { margin: 0; }
    #inspector dt { color: var(--text-dim); font-size: 11px; text-transform: uppercase; margin-top: 8px; }
    #inspector dd { margin: 2px 0 0; word-break: break-word; }
    #empty-state {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; z-index: 5; pointer-events: none;
    }
    #empty-state.hidden { display: none; }
    #empty-state p { color: var(--text-dim); font-size: 14px; max-width: 420px; text-align: center; }
  </style>
</head>
<body>
  <div id="scene-container"></div>

  <div id="empty-state">
    <p>Load a <code>graph.json</code> produced by <code>sentinel-zero analyze</code> to begin.
    Nothing is sent anywhere — the file is read in your browser only.</p>
  </div>

  <div id="hud">
    <h1>Sentinel-Zero — Graph Viewer</h1>
    <p class="sub">Standalone 3D view of a scan's node/edge export.</p>
    <label class="btn" id="file-input-label" for="file-input">Load graph.json…</label>
    <input id="file-input" type="file" accept="application/json,.json" />
    <div id="stats"></div>

    <h3>Filter</h3>
    <input id="search-input" type="text" placeholder="Filter by name…" />
    <div id="legend"></div>
    <div id="filter-actions">
      <button class="btn small" id="isolate-verified-true-btn">Isolate VERIFIED_TRUE</button>
      <button class="btn small" id="reset-filter-btn">Reset filter</button>
    </div>

    <h3>Compare to another scan</h3>
    <label class="btn" id="compare-input-label" for="compare-input">Load baseline graph.json…</label>
    <input id="compare-input" type="file" accept="application/json,.json" />
    <div id="compare-summary"></div>
    <div id="filter-actions">
      <button class="btn small" id="clear-compare-btn" style="display:none">Clear comparison</button>
    </div>
  </div>

  <div id="inspector"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
